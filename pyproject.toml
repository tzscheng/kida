# Dev workspace for the standalone kida repo (/home/ubuntu/kida).
# uv run from this directory resolves here (fg's workspace is not reachable
# once kida lives outside /home/ubuntu/fg — getcwd() is physical).
[project]
name = "kida"
version = "0.1.0"
description = "kida 14-DoF dual-arm manipulator control project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "opencv-python>=4.13",
    "pytact>=0.1.0a6",
    "pyyaml>=6.0.3",
    "pyzmq>=27.1.0",
    "zstandard>=0.25.0",
]

# pytact is consumed from PyPI (https://pypi.org/project/pytact/), NOT from the
# local ../pytact clone. There is deliberately no [tool.uv.sources] override, so
# local edits to ../pytact never leak into this workspace — bump the version pin
# above and `uv sync` to pick up a new release.

[tool.uv]
package = false
