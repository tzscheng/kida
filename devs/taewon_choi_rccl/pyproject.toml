# kida-gui 전용 워크스페이스.
#
# 이 폴더는 kida repo 안에 있지만 repo 루트의 pyproject.toml을 쓰지 않습니다.
# GUI는 kida/pytact 모듈을 import하지 않고 ./kida-run 같은 실행 파일을
# subprocess로 띄우기만 하므로, 무거운 pyside6/pyte 의존성을 repo 전체에
# 얹지 않고 여기서만 관리합니다. `uv run`은 cwd에서 위로 올라가며 가장 가까운
# pyproject.toml을 찾으므로, 이 폴더 안에서 실행하면 이 파일이 잡힙니다.
[project]
name = "kida-gui"
version = "0.1.0"
description = "KIDA 통합 GUI 런처 (텔레오퍼레이션 + HDF5 에피소드 수집)"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13",
    "pyside6>=6.8",
    "pyte>=0.8.2",
    "pyzmq>=27.1.0",
]

# temps/build.sh가 쓰는 컴파일러. 런타임에는 필요 없으므로 별도 그룹으로 둡니다:
#   uv sync --group build
# patchelf는 nuitka standalone이 리눅스에서 요구하는데 시스템에 없을 수 있어
# PyPI 배포판(바이너리 포함)을 함께 넣습니다.
[dependency-groups]
build = [
    "nuitka>=2.5",
    "patchelf>=0.17",
    "ordered-set>=4.1",
]

[tool.uv]
package = false
