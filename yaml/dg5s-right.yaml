# DG-5F-S fingertip tactile option (Tesollo): 4.8 x 9.6 mm sensing area,
# 18 taxels in a 3 x 6 grid (1.6 mm pitch), 60 FPS, 20 N range, normal
# force only. One pad per distal link, centred on the link, on the palmar
# face. Sample row: [x y z  nx ny nz  ux uy uz  area] in the distal link
# frame; rows follow the datasheet numbering (taxel 1..18, row-major, row 1
# distal -> row 6 proximal) and tangent_u is the finger axis (base -> tip).
# A capsule link gets exactly one contact point per shape pair (tact multi-
# point narrowphase is box-box only), so `cell` never fires and `radius`
# alone sets the patch width; the kernel is unnormalised, so sum(frame) is
# ~4x the true normal force -- calibrate, do not read it as newtons.
# Regenerate with: uv run utils/gen_taxels.py yaml/dg5s-right.yaml (local-only tool)

# Not completed. Don't use this function.
tactiles:
  - name: thumb_fingertip_taxel
    body: thumb4
    fps: 60
    cell: [0.0016, 0.0016]   # inert for capsule links (see below)
    radius: 0.0024
    filter_tau: 0.03
    kernel: gaussian
