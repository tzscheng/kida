#abstract: 7-dof manipulatr (left arm)
#date: 2026-01-13

sim: {solver: lcp, dt: 0.001, g: [0, 0, -9.81]}
view: {target: [0, 0, -0.34], distance: 1.3, yaw: 45, pitch: 20}
lights: [{pos: [7, 7, 7], target: [0, 0, 0], ortho: 5.0, shadow: false}]

bodies:
  - name: root

  - name: link1
    joint: {type: rev, parent: root, pos: [0, 0.146, 0], euler: [90, 0, 0], damping: 5.0}
    inertial: {mass: 2.015, tensor: [diag, 0.004, 0.004, 0.004], pos: [-0.006, 0, -0.067]}
    shapes: [{type: cylinder, param: [0.02, 0.05], rgba: [0.9, 0.9, 0.3, 1.0]}]

  - name: link2
    joint: {type: rev, parent: link1, pos: [0, 0, -0.081], euler: [0, 90, 0], damping: 5.0}
    inertial: {mass: 0.466, tensor: [diag, 0.004, 0.004, 0.004], pos: [0.002, -0.033, -0.001]}
    shapes:
      - {type: cylinder, param: [0.02, 0.025], rgba: [0.9, 0.9, 0.9, 1.0]}
      - {type: cylinder, pos: [0, -0.05, 0], euler: [-90, 0, 0], param: [0.02, 0.02], rgba: [0.4, 0.4, 0.9, 1.0]}

  - name: link3
    joint: {type: rev, parent: link2, pos: [0, -0.071, 0], euler: [-90, 0, 0], damping: 5.0}
    inertial: {mass: 2.602, tensor: [diag, 0.004, 0.004, 0.004], pos: [-0.001, -0.011, -0.142]}
    shapes: [{type: cylinder, pos: [0, 0, -0.125], param: [0.02, 0.115], rgba: [0.9, 0.9, 0.9, 1.0]}]

  - name: link4
    joint: {type: rev, parent: link3, pos: [0, -0.030, -0.249], euler: [0, -90, 0], damping: 5.0}
    inertial: {mass: 0.326, tensor: [diag, 0.004, 0.004, 0.004], pos: [-0.037, 0.021, 0.001]}
    shapes:
      - {type: cylinder, param: [0.02, 0.025], rgba: [0.9, 0.9, 0.9, 1.0]}
      - {type: cylinder, pos: [-0.03, 0.03, 0], euler: [0, 90, 0], param: [0.02, 0.03], rgba: [0.9, 0.9, 0.9, 1.0]}

  - name: link5
    joint: {type: rev, parent: link4, pos: [-0.063, 0.030, 0], euler: [0, 90, 0], damping: 5.0}
    inertial: {mass: 1.942, tensor: [diag, 0.004, 0.004, 0.004], pos: [-0.001, 0, -0.087]}
    shapes: [{type: cylinder, pos: [0, 0, -0.11], param: [0.02, 0.1], rgba: [0.9, 0.9, 0.9, 1.0]}]

  - name: link6
    joint: {type: rev, parent: link5, pos: [0, 0, -0.245], euler: [0, -90, 0], damping: 5.0}
    inertial: {mass: 0.463, tensor: [diag, 0.004, 0.004, 0.004], pos: [0, -0.002, 0]}
    shapes: [{type: cylinder, param: [0.02, 0.03], rgba: [0.9, 0.9, 0.9, 1.0]}]

  - name: link7
    joint: {type: rev, parent: link6, euler: [90, 0, 0], damping: 5.0}
    inertial: {mass: 0.102, tensor: [diag, 0.004, 0.004, 0.004], pos: [-0.029, 0, 0.003]}
    shapes: [{type: cylinder, param: [0.02, 0.03], rgba: [0.9, 0.9, 0.9, 1.0]}]

  - name: tcp
    joint: {type: fixed, parent: link7, pos: [-0.05, 0, 0], euler: [180, 180, 0]}
    inertial: {mass: 1.6, pos: [0.08, 0, 0], tensor: [sphere, 0.03]}
    shapes: [{type: cylinder, euler: [0, 90, 0], param: [0.03, 0.01], rgba: [0.9, 0.4, 0.4, 1.0]}]


feeds:
  - jointpos: [link1, link2, link3, link4, link5, link6, link7]
  - jointvel: [link1, link2, link3, link4, link5, link6, link7]
  - jointact: [link1, link2, link3, link4, link5, link6, link7]


cameras:
  - {name: headcam,  type: rgb, body: root, pos: [0.3, 0, 0.3], euler: [0, 0, 0], res: [640, 480], fps: 30, vfov: 45, port: 5557}
  - {name: wristcam, type: rgb, body: tcp,  pos: [0, -0.06, 0], euler: [-10, -90, 0], eulerseq: xyz, res: [640, 480], fps: 30, vfov: 45, port: 5558}